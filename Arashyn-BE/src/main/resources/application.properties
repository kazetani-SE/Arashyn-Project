spring.application.name=Arashyn

# PostgreSQL (Supabase)
spring.datasource.url=${DB_ARASHYN_URL}
spring.datasource.username=${DB_ARASHYN_USERNAME}
spring.datasource.password=${DB_ARASHYN_PASSWORD}

# Hikari (Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger

# Supabase Auth
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}

# CORS
cors.allowed-origins=http://localhost:3000, http://localhost:5173, http://localhost:5174
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

# OpenAPI
openapi.title=Arashyn API
openapi.description=REST API for Arashyn Platform
openapi.version=v1.0
openapi.contact-name=佐藤嵐
openapi.contact-email=touman876@gmail.com