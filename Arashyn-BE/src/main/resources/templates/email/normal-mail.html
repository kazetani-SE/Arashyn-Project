<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Arashyn</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color: #f4f6f8; padding: 40px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 520px; background-color: #ffffff; border-radius: 12px; overflow: hidden;">

                <!-- Header -->
                <tr>
                    <td style="padding: 28px 32px; background-color: #111827;">
                        <div style="font-size: 24px; font-weight: bold; color: #ffffff;">
                            Arashyn
                        </div>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding: 36px 32px;">

                        <!-- Subject / Title -->
                        <h1 th:text="${subject}"
                            style="margin: 0 0 20px;
                                   font-size: 24px;
                                   line-height: 1.4;
                                   color: #111827;">
                            Email Subject
                        </h1>

                        <!-- Body -->
                        <div th:utext="${body}"
                             style="font-size: 15px;
                                    line-height: 1.7;
                                    color: #4b5563;">
                            Email body goes here.
                        </div>

                        <!-- Signature -->
                        <p style="margin: 28px 0 0;
                                  font-size: 14px;
                                  line-height: 1.6;
                                  color: #4b5563;">
                            Best regards,<br>
                            <strong>The Arashyn Team</strong>
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding: 20px 32px;
                               background-color: #f9fafb;
                               border-top: 1px solid #e5e7eb;">

                        <p style="margin: 0;
                                  text-align: center;
                                  font-size: 12px;
                                  line-height: 1.6;
                                  color: #9ca3af;">
                            This is an automated email. Please do not reply to this message.
                        </p>

                        <p style="margin: 8px 0 0;
                                  text-align: center;
                                  font-size: 12px;
                                  color: #9ca3af;">
                            © Arashyn
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
